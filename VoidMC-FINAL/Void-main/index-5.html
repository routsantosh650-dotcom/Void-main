  var hide=(sweep-lim)/(2*sweep||1)*100;
  var turn=function(a){return "translateZ("+R+"px) rotateY("+a.toFixed(4)+"deg) translateZ(-"+R+"px)";};
  var tw=h*ASP,share=tw/N,dur=cols*SPEED,out="";
  var kf="@keyframes vmc-orbit{from{transform:"+turn(-sweep)+"}to{transform:"+turn(sweep)+"}0%,"+hide+"%,"+(100-hide)+"%,100%{visibility:hidden}"+(hide+.001)+"%,"+(100-hide-.001)+"%{visibility:visible}}";
  for(var t=0;t<cols;t++){
    var img=IM[(cols-1-t)%IM.length];
    out+='<div style="position:absolute;left:'+(W-tw)/2+'px;top:'+(H-h)/2+'px;width:'+tw+'px;height:'+h+'px;transform-style:preserve-3d;animation:vmc-orbit '+dur+'s linear '+(-t*SPEED)+'s infinite">';
    for(var k=0;k<N;k++){
      var rad=k==0?"border-radius:10px 0 0 10px;":k==N-1?"border-radius:0 10px 10px 0;":"";
      out+='<div style="position:absolute;top:0;overflow:hidden;background:#130C22;'+rad+'left:'+(tw-share)/2+'px;width:'+(k==N-1?share:share+1)+'px;height:'+h+'px;transform:'+turn((ASP/2-(k+.5)*ASP/N)*unit)+'"><img src="'+img+'" draggable="false" style="position:absolute;top:0;max-width:none;object-fit:cover;left:'+(-k*share)+'px;width:'+tw+'px;height:'+h+'px"></div>';
    }
    out+='</div>';
  }
  el.innerHTML='<style>'+kf+'</style><div class="vmc-stage" style="perspective:'+(R*CAM)+'px;perspective-origin:50% 50%">'+out+'</div>';
}
function mount(){
  var hero=document.querySelector('img[src*="cherry_blossom.webp"]');
  if(!hero)return;
  var bg=hero.parentElement;
  if(!bg.querySelector(".vmc-wither")){
    bg.insertAdjacentHTML("afterbegin",'<div class="vmc-aurora" style="width:420px;height:420px;background:#9333ea;top:-80px;left:-80px"></div><div class="vmc-aurora" style="width:380px;height:380px;background:#ec4899;top:33%;right:-80px;animation-delay:-5s"></div><div class="vmc-aurora" style="width:340px;height:340px;background:#6366f1;bottom:0;left:33%;animation-delay:-9s"></div><img class="vmc-wither" alt="" src="'+WITHER+'">');
  }
  if(document.querySelector(".vmc-pano"))return;
  var n=document.evaluate("//*[contains(text(),'BEDROCK IP')]",document,null,9,null).singleNodeValue;
  while(n&&n.parentElement&&String(n.parentElement.className).indexOf("max-w-4xl")<0)n=n.parentElement;
  if(!n||!n.parentElement)return;
  var p=document.createElement("div");p.className="vmc-pano";
  n.parentElement.insertBefore(p,n);
  render(p);
  var last=p.clientWidth;
  new ResizeObserver(function(){if(p.clientWidth!==last){last=p.clientWidth;render(p);}}).observe(p);
}
var q=false;
new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;mount();});}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
